<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สอบสัสดี 70</title>
<meta name="theme-color" content="#1597ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="สอบสัสดี">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f1e7; --card:#fffdf8; --ink:#2a2420; --muted:#7a6f66; --line:#e6ddcf;
  --accent:#2f5d8a; --ok:#2e7d4f; --ok-bg:#e3f2e8; --bad:#b3412f; --bad-bg:#f8e3df;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
  --r:16px; --ui:"IBM Plex Sans Thai",system-ui,-apple-system,sans-serif; --read:"Sarabun","IBM Plex Sans Thai",serif;
  --fs:20px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
[data-theme="sepia"]{--paper:#efe3cc;--card:#f7eedb;--ink:#3b2f22;--muted:#806d58;--line:#dccbab}
[data-theme="dark"]{--paper:#17181b;--card:#212328;--ink:#e8e4dc;--muted:#9a958c;--line:#33363c;--ok-bg:#1d3528;--bad-bg:#3d2320;--ok:#6fcf97;--bad:#f08b7a;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:var(--sat)}
.topbar .wrap{display:flex;align-items:center;gap:8px;min-height:58px}
.topbar h1{font-size:18px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.icon-btn:active{background:var(--line)}
.icon-btn svg{width:24px;height:24px}
.progress-line{height:3px;background:transparent}
.progress-line i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
main{padding:20px 0 calc(48px + var(--sab))}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.tabbar .wrap{display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;font-size:13px;color:var(--muted)}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--accent);font-weight:600}
/* common */
h2.sec{font-size:15px;font-weight:600;color:var(--muted);margin:28px 0 12px;letter-spacing:.02em}
.hello{font-size:28px;font-weight:700;margin:4px 0 2px;line-height:1.3}
.sub{color:var(--muted);margin:0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:14px;font-weight:600;background:var(--accent);color:#fff}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.block{width:100%}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.row-btns .btn{flex:1;min-width:150px}
.pill{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--line);color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
/* continue card */
.continue{display:flex;gap:16px;padding:16px;align-items:center;width:100%;text-align:left}
.mini-cover{width:64px;height:86px;border-radius:8px;flex:none;color:#fff;font-size:11px;font-weight:600;padding:8px;line-height:1.3;display:flex;align-items:flex-end;box-shadow:inset -4px 0 0 rgba(0,0,0,.15)}
.continue .t{font-weight:600;font-size:18px;line-height:1.35}
/* book grid */
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
.book{text-align:left;display:flex;flex-direction:column;gap:10px}
.cover{aspect-ratio:3/4;border-radius:10px 14px 14px 10px;color:#fff;padding:16px 16px 14px 22px;display:flex;flex-direction:column;justify-content:space-between;position:relative;box-shadow:0 6px 18px rgba(0,0,0,.14);overflow:hidden}
.cover:before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.25)}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.14),transparent 50%)}
.cover b{font-size:19px;line-height:1.3;font-weight:700}
.cover small{opacity:.8;font-size:12px}
.book .meta{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid var(--line);text-align:left;width:100%;min-height:64px}
.item:last-child{border-bottom:0}
.item:active{background:color-mix(in srgb,var(--line) 50%,transparent)}
.item .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:600;font-size:14px;background:var(--line);color:var(--muted)}
.item .n.done{background:var(--ok);color:#fff}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-weight:500;line-height:1.4}
.item .tx span{font-size:13px;color:var(--muted)}
.chev{width:20px;height:20px;color:var(--muted);flex:none}
.score-chip{font-weight:700;font-size:15px;padding:4px 12px;border-radius:99px;background:var(--line);flex:none}
.score-chip.good{background:var(--ok-bg);color:var(--ok)}
.score-chip.low{background:var(--bad-bg);color:var(--bad)}
/* book hero */
.hero{display:flex;gap:20px;align-items:flex-end;margin-bottom:8px}
.hero .cover{width:130px;flex:none}
.hero .cover b{font-size:16px}
.hero h2{font-size:26px;line-height:1.3;margin:0 0 4px}
/* reader */
.reader{font-family:var(--read);font-size:var(--fs);line-height:1.85;padding-top:8px}
.reader .chap-no{font-family:var(--ui);font-size:14px;color:var(--muted);font-weight:500}
.reader h2.ct{font-family:var(--ui);font-size:1.45em;line-height:1.35;margin:4px 0 24px}
.reader h3{font-family:var(--ui);font-size:1.1em;margin:1.6em 0 .4em}
.reader p{margin:0 0 1em}
.reader ul{margin:0 0 1em;padding-left:1.3em}
.reader li{margin:.25em 0}
.reader blockquote{margin:1.2em 0;padding:14px 18px;border-left:4px solid var(--accent);background:var(--card);border-radius:0 12px 12px 0}
.chap-nav{display:flex;gap:10px;margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.chap-nav .btn{flex:1}
.panel{position:fixed;z-index:30;left:50%;transform:translateX(-50%);top:calc(64px + var(--sat));width:min(380px,calc(100% - 24px));padding:18px}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:48px;border-radius:12px;border:1.5px solid var(--line);font-weight:500}
.seg button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.seg .sw{width:18px;height:18px;border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:6px;border:1px solid rgba(0,0,0,.15)}
.panel label{display:block;font-size:13px;color:var(--muted);margin:0 0 8px}
.panel .gap{height:16px}
/* quiz */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.qhead .bar{flex:1;height:8px}
.qhead span{font-size:14px;color:var(--muted);font-weight:600;white-space:nowrap}
.question{font-size:23px;font-weight:600;line-height:1.5;margin:0 0 22px}
.choices{display:flex;flex-direction:column;gap:12px}
.choice{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:64px;border-radius:14px;background:var(--card);border:2px solid var(--line);text-align:left;font-size:18px;line-height:1.45;transition:border-color .15s,background .15s}
.choice .k{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;background:var(--line);flex:none;font-size:16px}
.choice:not([disabled]):active{border-color:var(--accent)}
.choice.right{border-color:var(--ok);background:var(--ok-bg)}
.choice.right .k{background:var(--ok);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice.wrong .k{background:var(--bad);color:#fff}
.choice.dim{opacity:.55}
.feedback{margin-top:20px;padding:16px 18px;border-radius:14px;animation:up .25s ease}
.feedback.ok{background:var(--ok-bg)}
.feedback.no{background:var(--bad-bg)}
.feedback b{display:block;font-size:18px;margin-bottom:2px}
.feedback.ok b{color:var(--ok)} .feedback.no b{color:var(--bad)}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.result{text-align:center;padding:28px 20px}
.ring{width:170px;height:170px;margin:0 auto 14px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring .v b{font-size:40px;line-height:1}
.ring .v span{color:var(--muted);font-size:14px}
.result h2{margin:6px 0 4px;font-size:24px}
.stamp{font-size:13px;color:var(--muted);margin-top:14px}
.review .rq{padding:16px;border-bottom:1px solid var(--line)}
.review .rq:last-child{border-bottom:0}
.review .rq p{margin:0 0 8px;font-weight:600}
.review .ans{font-size:15px;display:flex;gap:8px;align-items:flex-start;margin:2px 0}
.review .ex{font-size:14px;color:var(--muted);margin-top:6px}
.ok-t{color:var(--ok)} .bad-t{color:var(--bad)}
/* modal & toast */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(20,15,10,.45);display:grid;place-items:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:min(440px,100%);padding:24px}
.modal h3{margin:0 0 6px;font-size:21px}
.modal p{margin:0 0 18px;color:var(--muted)}
.field{width:100%;min-height:54px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:18px;padding:0 16px;margin-bottom:16px}
.field:focus{outline:none;border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:12px;z-index:50;font-weight:500;animation:up .2s}
.hint{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;margin-top:18px;font-size:15px}
.hint svg{width:22px;height:22px;flex:none;color:var(--accent);margin-top:2px}
.hint .x{margin-left:auto;color:var(--muted);font-size:22px;line-height:1;padding:0 4px}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.name-btn{color:var(--accent);font-weight:600;font-size:15px;padding:0}
@media (max-width:520px){.hello{font-size:24px}.question{font-size:20px}.hero .cover{width:100px}.hero h2{font-size:22px}}
.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.subj{position:relative;text-align:left;min-height:190px;padding:20px;border-radius:20px;background:var(--c);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;overflow:hidden;box-shadow:0 8px 20px color-mix(in srgb,var(--c) 30%,transparent)}
.subj:active{transform:scale(.98)}
.subj:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0,rgba(255,255,255,.18),transparent 55%);pointer-events:none}
.subj .no{position:absolute;top:14px;left:20px;font-size:15px;font-weight:600;opacity:.75}
.subj .ic{position:absolute;top:16px;right:16px;width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.subj .ic svg{width:34px;height:34px}
.subj b{font-size:24px;line-height:1.3;font-weight:700}
.subj .st{font-size:13px;opacity:.85}
.dot{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.dot svg{width:24px;height:24px}
.subj-hero{display:flex;align-items:center;gap:18px;padding:24px;border-radius:20px;background:var(--c);color:#fff;margin-bottom:20px}
.subj-hero .ic{width:72px;height:72px;border-radius:18px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.subj-hero .ic svg{width:42px;height:42px}
.subj-hero small{opacity:.8;font-size:14px}
.subj-hero h2{margin:0;font-size:30px;line-height:1.25}
.options{display:grid;gap:14px}
.opt{position:relative;display:flex;align-items:center;gap:16px;padding:22px 20px 26px;text-align:left;width:100%;overflow:hidden}
.opt:active{transform:scale(.99)}
.opt .oi{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.opt .oi svg{width:30px;height:30px}
.opt .tx{flex:1}
.opt .tx b{display:block;font-size:22px;font-weight:700}
.opt .tx span{color:var(--muted);font-size:15px}
.opt .bar{position:absolute;left:20px;right:20px;bottom:12px;height:4px}
.opt .bar i{background:var(--c)}
@media (min-width:700px){.subj{min-height:220px}.options{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.subjects{gap:12px}.subj{min-height:160px;padding:16px}.subj b{font-size:20px}.subj .ic{width:48px;height:48px}.subj .ic svg{width:28px;height:28px}}

/* ===== ธีมฟ้าสดใส ===== */
:root{--paper:#fff;--card:#fff;--ink:#1d2b3a;--muted:#62778c;--line:#e2ebf3;--accent:#0a84ff;--ok:#1f9d55;--ok-bg:#e2f6ea;--bad:#e5484d;--bad-bg:#fde8e8;
  --bg:linear-gradient(165deg,#1597ff 0%,#3fbcff 45%,#86dcff 100%);--on-bg:#fff;--bar:#1597ff;
  --shadow:0 2px 6px rgba(10,60,120,.10),0 10px 24px rgba(10,60,120,.14)}
[data-theme="sepia"]{--paper:#fbf3e2;--card:#fbf3e2;--ink:#3b2f22;--muted:#806d58;--line:#eadcc0}
[data-theme="dark"]{--bg:linear-gradient(165deg,#0b1a2e,#123456);--bar:#0b1a2e;--paper:#18283b;--card:#18283b;--ink:#e6edf3;--muted:#93a4b5;--line:#2a3d52;--accent:#4aa8ff;--shadow:none}
html{background:var(--bar)}
body{background:transparent;min-height:100vh;color:var(--ink)}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 88% 6%,rgba(255,255,255,.32) 0 70px,transparent 71px),
  radial-gradient(circle at 6% 34%,rgba(255,255,255,.16) 0 110px,transparent 111px),
  radial-gradient(circle at 92% 78%,rgba(255,255,255,.14) 0 150px,transparent 151px),
  radial-gradient(circle at 30% 100%,rgba(255,255,255,.12) 0 90px,transparent 91px),var(--bg)}
[data-theme="dark"] body:before{background:var(--bg)}
.topbar{background:color-mix(in srgb,var(--bar) 55%,transparent);border-bottom:0;color:var(--on-bg)}
.icon-btn:active{background:rgba(255,255,255,.22)}
.progress-line{background:rgba(255,255,255,.25)}
.progress-line i{background:#fff}
main{color:var(--on-bg)}
main .sub,h2.sec{color:rgba(255,255,255,.9)}
[data-theme="dark"] main .sub,[data-theme="dark"] h2.sec{color:var(--muted)}
h2.sec{font-size:16px}
.hello{font-size:32px;text-shadow:0 2px 10px rgba(0,60,140,.18)}
.card{color:var(--ink);border:0}
.card .sub,main .card .sub{color:var(--muted)}
.name-btn{color:#fff;text-decoration:underline;text-underline-offset:3px}
.btn{box-shadow:0 4px 12px rgba(0,80,180,.22)}
.btn.ghost{background:rgba(255,255,255,.96);color:#1d2b3a;border:0}
[data-theme="dark"] .btn.ghost{background:var(--card);color:var(--ink)}
.reader.card{padding:26px 26px 30px;margin-top:4px}
.reader blockquote{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.chap-nav{border-top:0;margin-top:22px;padding-top:0}
.question{color:var(--on-bg);text-shadow:0 1px 8px rgba(0,60,140,.15)}
.qhead .bar{background:rgba(255,255,255,.35)}
.qhead .bar i{background:#fff}
.qhead span{color:#fff}
.choice{color:var(--ink);border-color:transparent;box-shadow:var(--shadow)}
.choice.dim{opacity:.65}
.feedback{color:var(--ink);box-shadow:var(--shadow)}
.empty{color:#fff}
.subj{box-shadow:0 8px 20px rgba(0,50,120,.25);border:3px solid rgba(255,255,255,.55)}
.subj-hero{box-shadow:0 8px 20px rgba(0,50,120,.2);border:3px solid rgba(255,255,255,.55)}
.opt .bar{background:var(--line)}
.qimg{display:block;width:100%;height:auto;border-radius:14px;margin:0 0 16px;background:#fff;box-shadow:var(--shadow)}
.passage{background:var(--card);color:var(--ink);border-radius:14px;padding:16px 18px;margin:0 0 16px;max-height:46vh;overflow:auto;-webkit-overflow-scrolling:touch;font-size:17px;line-height:1.75;white-space:pre-line;box-shadow:var(--shadow)}
.feedback .ex{white-space:pre-line;font-size:15.5px;line-height:1.65;margin-top:6px}
.reader{font-weight:500;color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.reader strong{font-weight:700;color:var(--ink)}
.reader mark{background:#fff1a8;color:#1d2b3a;padding:0 .2em;border-radius:4px;font-weight:700}
[data-theme="dark"] .reader mark{background:#6b5a12;color:#fff}
.reader h3{font-size:1.18em;color:var(--accent);margin:1.5em 0 .5em;padding-bottom:.25em;border-bottom:2px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.reader h4{font-family:var(--ui);font-size:1.02em;margin:1.2em 0 .4em}
.reader ol{margin:0 0 1em;padding-left:1.5em}
.reader ol li,.reader ul li{margin:.3em 0}
.reader .key{position:relative;background:#fff4e5;border:2px solid #ffb347;color:#3d2a12;border-radius:14px;padding:30px 18px 14px;margin:1.2em 0}
[data-theme="dark"] .reader .key{background:#3a2a12;color:#ffe7c2;border-color:#a8742a}
.reader .key-tag{position:absolute;top:-1px;left:-1px;background:#ff9f1c;color:#fff;font-family:var(--ui);font-size:13px;font-weight:700;padding:3px 12px;border-radius:12px 0 12px 0}
.reader .tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 1.2em;border-radius:12px;border:1px solid var(--line)}
.reader table{border-collapse:collapse;width:100%;font-size:.88em;line-height:1.55}
.reader th{background:color-mix(in srgb,var(--accent) 12%,var(--card));text-align:left;font-family:var(--ui);font-weight:700;padding:10px 12px;white-space:nowrap}
.reader td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.reader tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--line) 35%,transparent)}
@font-face{font-family:"THSarabunApp";src:url("THSarabun.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"THSarabunApp";src:url("THSarabun-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
:root{--read:"THSarabunApp","Sarabun","IBM Plex Sans Thai",serif}
.reader{font-size:calc(var(--fs) * 1.3);line-height:1.55;font-weight:400}
.reader h2.ct,.reader h3,.reader h4,.reader .chap-no,.reader th,.reader .key-tag{font-family:var(--read)}
.reader h2.ct{font-size:1.5em}
.reader table{font-size:.95em;line-height:1.35}
.reader .chap-no{font-size:calc(var(--fs) * .95)}
.reader .key-tag{font-size:18px}
.reader th{font-size:1em}

/* PDF */
.pdfwrap{max-width:960px}
.pt{font-size:19px;line-height:1.4;margin:0 0 10px;color:#fff}

.pbar .btn{min-height:44px;padding:0 18px;flex:none}

.pdfpage{border-radius:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;min-height:200px}
.pp{background:#fff;border-radius:6px;box-shadow:var(--shadow);margin:0 auto 12px;overflow:hidden}
.pp canvas{display:block;max-width:none}

.pmsg{padding:40px 16px;color:#fff;text-align:center}
.subj.wide{grid-column:1/-1;min-height:150px}

.xhead .xt{font-size:20px;color:var(--on-bg,#fff);font-variant-numeric:tabular-nums}

.choice.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}

.xsec{grid-column:1/-1;font-weight:700;font-size:.9rem;margin:8px 0 0;color:var(--muted,#888)}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;max-height:55vh;overflow:auto;padding:2px}

.xp{display:flex;align-items:center;gap:10px;margin:8px 0}

.xp .bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden;display:block}
.xp .bar i{display:block;height:100%;border-radius:99px}
.xp b{width:56px;text-align:right;flex:none}

<body>
<div id="app"></div>
<script src="content.js"></script>
<script>
(function(){
"use strict";
var C = window.APP_CONTENT || {};
C.books = (C.subjects || C.books || []).map(function(x){ x.chapters = x.summaries || x.chapters || []; return x; });
var KEY = "bookapp-v1";
var S = {name:"", fontSize:20, theme:"light", progress:{}, results:[], last:null, hideHint:false};
try { var saved = JSON.parse(localStorage.getItem(KEY) || "{}"); for (var k in saved) S[k] = saved[k]; } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
/* ย้ายความคืบหน้าวิชาสัสดีตามลำดับใหม่ (25 → 11 เรื่องใน v14 → 8 เรื่องใน v15) */
(function(){
  if (S.mig_sassadee_v15) return;
  var b = null; for (var i=0;i<C.books.length;i++) if (C.books[i].id==="sassadee") b = C.books[i];
  if (!b || b.chapters.length !== 8) return;
  var MAP = S.mig_sassadee_v14
    ? {0:0,1:1,2:2,3:3,7:4,8:5,9:6,10:7}                 /* จากลำดับ v14 (11 เรื่อง) */
    : {1:0,2:1,3:2,13:3,21:4,22:5,23:6,24:7};            /* จากลำดับเดิม (25 เรื่อง) */
  var p = S.progress && S.progress.sassadee;
  if (p) for (var k in p) {
    var o = p[k]; if (!o || typeof o !== "object" || Array.isArray(o)) continue;
    var n = {}; for (var j in o) if (MAP.hasOwnProperty(j)) n[MAP[j]] = o[j];
    p[k] = n;
  }
  if (S.last && S.last.bookId==="sassadee") S.last = MAP.hasOwnProperty(S.last.ch) ? {bookId:"sassadee", ch:MAP[S.last.ch]} : null;
  S.mig_sassadee_v14 = true; S.mig_sassadee_v15 = true; save();
})();

var app = document.getElementById("app");
var stack = [];       // navigation stack
var quiz = null;      // active quiz state
var cleanup = null;   // per-view teardown

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function inline(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/==(.+?)==/g, "<mark>$1</mark>").replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>"); }
function book(id){ for (var i=0;i<C.books.length;i++) if (C.books[i].id===id) return C.books[i]; return null; }
function allQuizzes(){ var out=[]; C.books.forEach(function(b){ (b.quizzes||[]).forEach(function(q){ out.push({book:b, quiz:q}); }); }); return out; }
function prog(bid){ if(!S.progress[bid]) S.progress[bid]={read:{},scroll:{}}; return S.progress[bid]; }
function readCount(b){ var p=S.progress[b.id]; if(!p) return 0; var n=0; for (var i=0;i<b.chapters.length;i++) if (p.read[i]) n++; return n; }
function attempts(qid){ return S.results.filter(function(r){ return r.quizId===qid; }); }
function best(qid){ var a=attempts(qid); if(!a.length) return null; return a.reduce(function(m,r){ return r.score/r.total > m.score/m.total ? r : m; }); }
function pct(r){ return Math.round(r.score/r.total*100); }
function chipClass(p){ return p>=80 ? "good" : (p<50 ? "low" : ""); }
function fmtDate(iso){ var d=new Date(iso); try { return d.toLocaleString("th-TH",{dateStyle:"medium",timeStyle:"short"}); } catch(e){ return d.toLocaleString(); } }
function shuffle(a){ a=a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
var LABELS = {kk:["ก","ข","ค","ง","จ","ฉ"], num:["1","2","3","4","5","6"], th:["๑","๒","๓","๔","๕","๖"]};
function labelsOf(def){ return LABELS[(def && def.labels) || "kk"] || LABELS.kk; }

var I = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
  books:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zm0 0A2 2 0 006 21.5h13"/><path d="M8 7h7"/></svg>',
  quiz:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8l1.5 1.5L12 7M8 14l1.5 1.5L12 13M14.5 8.5H17M14.5 14.5H17"/></svg>',
  score:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0V4z"/><path d="M7 6H4v1a3 3 0 003 3M17 6h3v1a3 3 0 01-3 3"/></svg>',
  aa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19l5-13 5 13M4.8 14.5h6.4M14 19l3.5-9 3.5 9M15.2 16h4.6"/></svg>',
  toc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>'
};

/* simple text -> HTML */
function render(text){
  var lines = String(text||"").replace(/\r/g,"").split("\n"), out=[], para=[], list=[], olist=[], table=[];
  function flushP(){ if(para.length){ out.push("<p>"+inline(para.join(" "))+"</p>"); para=[]; } }
  function flushL(){ if(list.length){ out.push("<ul>"+list.map(function(x){return "<li>"+inline(x)+"</li>";}).join("")+"</ul>"); list=[]; } }
  function flushO(){ if(olist.length){ out.push("<ol>"+olist.map(function(x){return "<li>"+inline(x)+"</li>";}).join("")+"</ol>"); olist=[]; } }
  function flushT(){
    if(!table.length) return;
    var rows = table.map(function(r){ return r.replace(/^\|/,"").replace(/\|\s*$/,"").split("|").map(function(c){ return c.trim(); }); });
    var h = '<div class="tbl"><table><thead><tr>'+rows[0].map(function(c){ return "<th>"+inline(c)+"</th>"; }).join("")+'</tr></thead><tbody>';
    rows.slice(1).forEach(function(r){ h += "<tr>"+r.map(function(c){ return "<td>"+inline(c)+"</td>"; }).join("")+"</tr>"; });
    out.push(h+"</tbody></table></div>"); table=[];
  }
  function flushAll(){ flushP(); flushL(); flushO(); flushT(); }
  lines.forEach(function(raw){
    var l = raw.trim();
    if (!l){ flushAll(); return; }
    if (l.charAt(0)==="|"){ flushP(); flushL(); flushO(); table.push(l); return; }
    flushT();
    if (l.indexOf("### ")===0){ flushAll(); out.push("<h4>"+inline(l.slice(4))+"</h4>"); return; }
    if (l.indexOf("## ")===0){ flushAll(); out.push("<h3>"+inline(l.slice(3))+"</h3>"); return; }
    if (l.indexOf("!! ")===0){ flushAll(); out.push('<div class="key"><span class="key-tag">จุดสำคัญ</span>'+inline(l.slice(3))+"</div>"); return; }
    if (l.indexOf("> ")===0){ flushAll(); out.push("<blockquote>"+inline(l.slice(2))+"</blockquote>"); return; }
    if (l.indexOf("- ")===0){ flushP(); flushO(); list.push(raw.match(/^\s{2,}/) && list.length ? "\u2003" + l.slice(2) : l.slice(2)); return; }
    var mo = l.match(/^(\d+)\.\s+(.*)$/);
    if (mo){ flushP(); flushL(); olist.push(mo[2]); return; }
    flushL(); flushO(); para.push(l);
  });
  flushAll();
  return out.join("");
}

/* ---------- navigation ---------- */
function go(view, params, replace){
  if (replace) stack.pop();
  stack.push({view:view, params:params||{}});
  show();
}
function back(){ if (stack.length>1){ stack.pop(); show(); } }
function tab(view){ stack=[{view:view, params:{}}]; show(); }
function show(){
  if (cleanup){ cleanup(); cleanup=null; }
  closePanel();
  var top = stack[stack.length-1];
  document.documentElement.style.setProperty("--fs", S.fontSize+"px");
  document.documentElement.setAttribute("data-theme", S.theme);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", getComputedStyle(document.documentElement).getPropertyValue("--bar").trim() || "#1597ff");
  VIEWS[top.view](top.params);
  if (top.view!=="reader") window.scrollTo(0,0);
}
function topbar(title, opts){
  opts = opts||{};
  return '<header class="topbar"><div class="wrap">'
    + (opts.back!==false && stack.length>1 ? '<button class="icon-btn" data-a="back" aria-label="ย้อนกลับ">'+I.back+'</button>' : '')
    + '<h1>'+esc(title)+'</h1>' + (opts.right||'') + '</div>'
    + (opts.progress ? '<div class="progress-line"><i id="pl"></i></div>' : '') + '</header>';
}
function tabbar(active){
  function t(v,label,icon){ return '<button class="tab'+(active===v?' on':'')+'" data-a="tab" data-v="'+v+'">'+icon+'<span>'+label+'</span></button>'; }
  return '<nav class="tabbar"><div class="wrap">'+t("home","ชั้นหนังสือ",I.books)+t("quizzes","แบบทดสอบ",I.quiz)+t("scores","ผลสอบ",I.score)+'</div></nav>';
}

/* ---------- views ---------- */
var VIEWS = {};

var THAI_D = "๐๑๒๓๔๕๖๗๘๙";
function th(n){ return String(n).replace(/\d/g, function(d){ return THAI_D[d]; }); }
var SUBJ_ICON = {
  shield:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M24 5l15 6v11c0 10-6.5 17.5-15 21-8.5-3.5-15-11-15-21V11z"/><path d="M17 24l5 5 9-10"/></svg>',
  abc:'<svg viewBox="0 0 48 48"><text x="24" y="32" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="currentColor">ABC</text></svg>',
  thai:'<svg viewBox="0 0 48 48"><text x="24" y="33" text-anchor="middle" font-family="IBM Plex Sans Thai,sans-serif" font-size="24" font-weight="700" fill="currentColor">กข</text></svg>',
  timer:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="27" r="15"/><path d="M24 18v9l6 4M19 5h10M24 5v7M36 13l3-3"/></svg>',
  lotus:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M24 38c-4-4-6-9-6-14s2-9 6-13c4 4 6 8 6 13s-2 10-6 14z"/><path d="M24 38c-6 0-12-3-15-9 3-2 7-3 10-2M24 38c6 0 12-3 15-9-3-2-7-3-10-2"/><path d="M12 42h24"/></svg>'
};
function bestOfSubject(s){
  var bs=null; (s.quizzes||[]).forEach(function(q){ var b=best(q.id); if (b && (!bs || pct(b)>pct(bs))) bs=b; }); return bs;
}

VIEWS.home = function(){
  var right = '<button class="icon-btn" data-a="go-scores" aria-label="ผลสอบของฉัน">'+I.score+'</button>';
  var h = topbar(C.appName||"ห้องเรียนออนไลน์", {back:false, right:right});
  h += '<main><div class="wrap">';
  h += '<p class="sub">สวัสดี</p><div class="hello">'+(S.name?esc(S.name):'ผู้เรียน')+'</div>';
  h += '<button class="name-btn" data-a="name">'+(S.name?'เปลี่ยนชื่อ':'ตั้งชื่อของฉัน')+'</button>';
  if (isIOSBrowser() && !S.hideHint){
    h += '<div class="card hint">'+I.share+'<div>ติดตั้งเป็นแอปบน iPad: กดปุ่ม <b>แชร์</b> ใน Safari แล้วเลือก <b>เพิ่มไปยังหน้าจอโฮม</b></div><button class="x" data-a="hidehint" aria-label="ปิด">×</button></div>';
  }
  h += '<h2 class="sec">เลือกวิชา</h2><div class="subjects">';
  C.books.forEach(function(s,k){
    var n = readCount(s), tot = s.chapters.length, bs = bestOfSubject(s);
    if (s.mock){ var dn=(s.quizzes||[]).filter(function(q){return attempts(q.id).length;}).length;
      h += '<button class="subj wide" data-a="subject" data-b="'+s.id+'" style="--c:'+esc(s.color||"#555")+'"><span class="no">'+th(k+1)+'</span><span class="ic">'+(SUBJ_ICON[s.icon]||SUBJ_ICON.abc)+'</span><b>'+esc(s.title)+'</b><span class="st">'+th((s.quizzes||[]).length)+' ชุด · ชุดละ ๑๐๐ ข้อ · ทำแล้ว '+th(dn)+' ชุด'+(bs?' · สูงสุด '+th(pct(bs))+'%':'')+'</span></button>'; return; }
    h += '<button class="subj" data-a="subject" data-b="'+s.id+'" style="--c:'+esc(s.color||"#555")+'">'
      + '<span class="no">'+th(k+1)+'</span><span class="ic">'+(SUBJ_ICON[s.icon]||SUBJ_ICON.abc)+'</span>'
      + '<b>'+esc(s.title)+'</b>'
      + '<span class="st">สรุป '+th(n+'/'+tot)+(bs?' · คะแนนสูงสุด '+th(pct(bs))+'%':'')+'</span></button>';
  });
  h += '</div>';
  var L = S.last && book(S.last.bookId);
  if (L && L.chapters[S.last.ch]){
    h += '<h2 class="sec">อ่านต่อจากครั้งที่แล้ว</h2>';
    h += '<button class="card item" data-a="read" data-b="'+L.id+'" data-c="'+S.last.ch+'"><span class="dot" style="background:'+esc(L.color)+'">'+(SUBJ_ICON[L.icon]||"")+'</span><span class="tx"><b>'+esc(L.chapters[S.last.ch].title)+'</b><span>'+esc(L.title)+' · สรุปเรื่องที่ '+th(S.last.ch+1)+'</span></span>'+I.chev+'</button>';
  }
  h += '</div></main>';
  app.innerHTML = h;
};

VIEWS.subject = function(p){
  var s = book(p.id); if(!s){ tab("home"); return; }
  if (s.mock) return mockPage(s);
  var n = readCount(s), tot = s.chapters.length, qn = (s.quizzes||[]).length, done = (s.quizzes||[]).filter(function(q){return attempts(q.id).length;}).length;
  var h = topbar(s.title);
  h += '<main><div class="wrap">';
  h += '<div class="subj-hero" style="--c:'+esc(s.color)+'"><span class="ic">'+(SUBJ_ICON[s.icon]||"")+'</span><div><small>วิชา</small><h2>'+esc(s.title)+'</h2></div></div>';
  h += '<div class="options">';
  h += '<button class="card opt" data-a="sums" data-b="'+s.id+'" style="--c:'+esc(s.color)+'"><span class="oi">'+I.books+'</span><span class="tx"><b>สรุป</b><span>'+th(tot)+' เรื่อง · อ่านแล้ว '+th(n)+'</span></span>'+I.chev+'<span class="bar"><i style="width:'+(tot?n/tot*100:0)+'%"></i></span></button>';
  h += '<button class="card opt" data-a="quizlist" data-b="'+s.id+'" style="--c:'+esc(s.color)+'"><span class="oi">'+I.quiz+'</span><span class="tx"><b>ข้อสอบ</b><span>'+th(qn)+' ชุด · ทำแล้ว '+th(done)+'</span></span>'+I.chev+'<span class="bar"><i style="width:'+(qn?done/qn*100:0)+'%"></i></span></button>';
  h += '</div></div></main>';
  app.innerHTML = h;
};

VIEWS.sums = function(p){
  var s = book(p.id); if(!s){ tab("home"); return; }
  var pr = S.progress[s.id] || {read:{}};
  var h = topbar("สรุป · "+s.title) + '<main><div class="wrap" style="--accent:'+esc(s.color)+'">';
  if (!s.chapters.length) h += '<div class="empty">ยังไม่มีเนื้อหาสรุป</div>';
  else {
    var gs=[],gm={};
    s.chapters.forEach(function(c,i){var g=c.group||"";if(!(g in gm)){gm[g]=[];gs.push(g)}gm[g].push(i)});
    gs.forEach(function(g,gi){
      if (g) h += '<h2 class="sec"'+(gi===0?' style="margin-top:4px"':'')+'>'+esc(g)+'</h2>';
      h += '<div class="card list">';
      gm[g].forEach(function(i){var c=s.chapters[i];
        var d = pr.read && pr.read[i], pg = pr.page && pr.page[i], pt = pr.pages && pr.pages[i];
        var st = c.video ? (d ? 'ดูจบแล้ว' : 'ยังไม่ได้ดู') : (d ? 'อ่านจบแล้ว' : (pg && pt ? 'อ่านถึงหน้า '+th(pg)+' จาก '+th(pt) : 'ยังไม่ได้อ่าน'));
        h += '<button class="item" data-a="read" data-b="'+s.id+'" data-c="'+i+'"><span class="n'+(d?' done':'')+'">'+(d?'✓':th(i+1))+'</span><span class="tx"><b>'+esc(c.title)+'</b><span>'+st+'</span></span>'+I.chev+'</button>';
      });
      h += '</div>';
    });
  }
  h += '</div></main>';
  app.innerHTML = h;
};

function qCount(q){ return q.count || (q.questions ? q.questions.length : 0); }
function quizItem(b,q){
  var bs = best(q.id), n = attempts(q.id).length, ip = S.inprog && S.inprog[q.id];
  var right = bs ? '<span class="score-chip '+chipClass(pct(bs))+'">'+th(bs.score+'/'+bs.total)+'</span>' : '<span class="pill">ยังไม่ได้ทำ</span>';
  var sub = th(qCount(q))+' ข้อ' + (ip ? ' · <b style="display:inline;color:var(--accent);font-weight:600">ทำค้างไว้ข้อ '+th(ip.i+1)+'</b>' : '') + (n?' · ทำแล้ว '+th(n)+' ครั้ง':'');
  return '<button class="item" data-a="quiz" data-b="'+b.id+'" data-q="'+q.id+'"><span class="n'+(bs?' done':'')+'">'+(bs?'✓':'?')+'</span><span class="tx"><b>'+esc(q.title)+'</b><span>'+sub+'</span></span>'+right+'</button>';
}

VIEWS.quizlist = function(p){
  var s = book(p.id); if(!s){ tab("home"); return; }
  var h = topbar("ข้อสอบ · "+s.title) + '<main><div class="wrap">';
  if (!(s.quizzes||[]).length) h += '<div class="empty">ยังไม่มีข้อสอบ</div>';

/* ---------- PDF reader ---------- */
var PDFS = {}, pdfZoom = 1;
function loadPdfLib(ok, bad){
  if (window.pdfjsLib && window.__pdfReady){ ok(); return; }
  var base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/";
  function ld(src, f){ var e=document.createElement("script"); e.src=src; e.onload=f; e.onerror=bad; document.head.appendChild(e); }
  ld(base+"pdf.min.js", function(){ ld(base+"pdf.worker.min.js", function(){ try { pdfjsLib.GlobalWorkerOptions.workerSrc = base+"pdf.worker.min.js"; } catch(e){} window.__pdfReady = true; ok(); }); });
}
function getPdf(url, ok, bad){
  if (PDFS[url]){ ok(PDFS[url]); return; }
  loadPdfLib(function(){
    fetch(url).then(function(r){ if(!r.ok) throw 0; return r.arrayBuffer(); }).then(function(buf){
      return pdfjsLib.getDocument({data:new Uint8Array(buf), disableWorker:true, cMapUrl:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/cmaps/", cMapPacked:true, useSystemFonts:true}).promise;
    }).then(function(d){ PDFS[url]=d; ok(d); }, bad);
  }, bad);
}
function readerPdf(b, i, c){
  document.documentElement.style.setProperty("--accent", b.color || "");
  S.last = {bookId:b.id, ch:i}; save();
  var pr = prog(b.id); pr.page = pr.page||{}; pr.pages = pr.pages||{};
  var right = '<button class="icon-btn" data-a="toc" aria-label="สารบัญ">'+I.toc+'</button><button class="icon-btn" data-a="aa" aria-label="ตั้งค่า">'+I.aa+'</button>';
  var h = topbar('สรุป · '+b.title, {right:right, progress:true});
  h += '<main><div class="wrap pdfwrap"><h2 class="pt">'+esc(c.title)+'</h2>'
     + '<div class="pbar"><span>หน้า <input type="number" min="1" inputmode="numeric" id="pnum"> / <b id="ptot">…</b></span><button class="btn ghost" id="pzo">−</button><button class="btn ghost" id="pzi">+</button></div>'
     + '<div class="pdfpage" id="pbox"><div class="pmsg" id="pmsg">กำลังโหลด…</div><div id="pages"></div></div></div></main>';
  app.innerHTML = h;
  window.scrollTo(0,0);
  var doc=null, dead=false, ratio=1.414, W=600, cur=Math.max(1, pr.page[i]||1), pl=document.getElementById("pl"), msg=document.getElementById("pmsg");
  var pagesEl=document.getElementById("pages"), box=document.getElementById("pbox"), numEl=document.getElementById("pnum"), io=null, queue=[], running=false, st={};
  function filt(cv){ cv.style.filter = S.theme==="dark" ? "invert(1) hue-rotate(180deg)" : "none"; }
  function sizeAll(){
    var bw = Math.min(box.clientWidth || 600, 900); W = bw*pdfZoom;
    pagesEl.style.width = W+"px"; pagesEl.style.margin = "0 auto";
    for (var n=1;n<=doc.numPages;n++){ var d=pagesEl.children[n-1]; d.style.width=W+"px"; d.style.height=(W*(st[n]&&st[n].r||ratio))+"px"; }
  }
  function pump(){
    if (running || dead) return;
    var n = queue.shift(); if (!n) return;
    var d = pagesEl.children[n-1];
    if (!d || !d._vis || (st[n] && st[n].w===W && st[n].ok)){ pump(); return; }
    running = true;
    doc.getPage(n).then(function(p){
      var base = p.getViewport({scale:1}), sc = W/base.width, r = Math.min(window.devicePixelRatio||1, 2), k = Math.sqrt(12e6/(base.width*sc*r*base.height*sc*r)); if (k<1) r*=k;
      var v = p.getViewport({scale:sc*r}), cv = d.querySelector("canvas") || d.appendChild(document.createElement("canvas"));
      cv.width = v.width; cv.height = v.height; cv.style.width = W+"px"; cv.style.height = (base.height*sc)+"px"; filt(cv);
      st[n] = {r:base.height/base.width, w:W, ok:false}; d.style.height = (base.height*sc)+"px";
      return p.render({canvasContext:cv.getContext("2d"), viewport:v}).promise.then(function(){ st[n].ok = true; });
    }).catch(function(){}).then(function(){ running=false; pump(); });
  }
  function want(n){ queue.push(n); pump(); }
  function free(n){ var d=pagesEl.children[n-1], cv=d&&d.querySelector("canvas"); if (cv){ cv.width=0; cv.height=0; } if (st[n]) st[n].ok=false; }
  function track(){
    if (!doc) return;
    var y = 120, best = 1, n;
    for (n=1;n<=doc.numPages;n++){ var t = pagesEl.children[n-1].getBoundingClientRect(); if (t.bottom > y+40){ best = n; break; } best = n; }
    if (best !== cur){ cur = best; pr.page[i] = cur; if (cur >= doc.numPages) pr.read[i] = true; clearTimeout(track.t); track.t = setTimeout(save, 300); }
    numEl.value = cur; if (pl) pl.style.width = (cur/doc.numPages*100)+"%";
  }
  function jump(n){ n = Math.max(1, Math.min(doc.numPages, n|0 || 1)); pagesEl.children[n-1].scrollIntoView(); window.scrollBy(0, -(document.querySelector(".topbar").offsetHeight + 64)); setTimeout(track, 50); }
  function build(){
    pagesEl.innerHTML = "";
    for (var n=1;n<=doc.numPages;n++){ var d=document.createElement("div"); d.className="pp"; d._n=n; pagesEl.appendChild(d); }
    sizeAll();
    if (io) io.disconnect();
    io = new IntersectionObserver(function(es){ es.forEach(function(e){ var d=e.target; d._vis=e.isIntersecting; if (e.isIntersecting) want(d._n); else free(d._n); }); }, {rootMargin:"1800px 0px"});
    for (var m=0;m<pagesEl.children.length;m++) io.observe(pagesEl.children[m]);
  }
  numEl.onchange = function(){ if (doc) jump(+numEl.value); };
  document.getElementById("pzi").onclick = function(){ pdfZoom=Math.min(2.5,pdfZoom+.2); relayout(); };
  document.getElementById("pzo").onclick = function(){ pdfZoom=Math.max(.6,pdfZoom-.2); relayout(); };
  function relayout(){ if (!doc) return; var keep=cur; st={}; for (var n=1;n<=doc.numPages;n++) free(n); sizeAll(); jump(keep); for (var m=0;m<pagesEl.children.length;m++){ var d=pagesEl.children[m]; if (d._vis) want(d._n); } }
  window.addEventListener("scroll", track, {passive:true});
  var onResize = function(){ relayout(); }; window.addEventListener("resize", onResize);
  cleanup = function(){ dead=true; if (io) io.disconnect(); window.removeEventListener("scroll", track); window.removeEventListener("resize", onResize); document.documentElement.style.removeProperty("--accent"); };
  getPdf(c.pdf, function(d){
    if (dead) return; doc = d; pr.pages[i] = d.numPages; msg.style.display = "none"; document.getElementById("ptot").textContent = d.numPages;
    d.getPage(1).then(function(p){ var v=p.getViewport({scale:1}); ratio = v.height/v.width; }).catch(function(){}).then(function(){
      build(); numEl.value = cur; if (cur>1) setTimeout(function(){ jump(cur); }, 60); else track(); });
  }, function(){ msg.innerHTML = 'เปิดไฟล์ไม่ได้ ต้องต่ออินเทอร์เน็ตในครั้งแรก<br><button class="btn" style="margin-top:12px" data-a="retry-pdf">ลองใหม่</button>'; });
}

/* ---------- quiz ---------- */
var loading = false;
function startQuiz(bid, qid, fresh){
  var b = book(bid), q = null;
  (b && b.quizzes || []).forEach(function(x){ if (x.id===qid) q=x; });
  if (!q) return;
  if (!q.questions && q.file){
    if (loading) return; loading = true;
    var closeL = modal('<h3>กำลังโหลดข้อสอบ…</h3><p>'+esc(q.name || q.title)+'</p>');
    var sc = document.createElement("script"); sc.src = q.file;
    sc.onload = function(){
      var data = window.QUIZ_DATA && window.QUIZ_DATA[q.id];
      loading = false; closeL(); sc.remove();
      if (data){ q.questions = data.questions; startQuiz(bid, qid, fresh); } else sc.onerror(true);
    };
    sc.onerror = function(already){
      if (already !== true){ loading = false; closeL(); sc.remove(); }
      modal('<h3>โหลดข้อสอบไม่ได้</h3><p>ไม่พบไฟล์ '+esc(q.file)+' ตรวจสอบว่าอัปโฟลเดอร์ data ขึ้นไปครบ หรือเชื่อมต่ออินเทอร์เน็ตอยู่</p><button class="btn block" data-m="x">ตกลง</button>', function(m, close){ m.querySelector('[data-m="x"]').onclick = close; });
    };
    document.head.appendChild(sc);
    return;
  }
  if (q.exam){ startExam(b, q, fresh); return; }
  var ip = S.inprog && S.inprog[q.id];
  if (ip && !fresh && !q.shuffle && ip.picks && ip.i < q.questions.length){
    modal('<h3>ทำต่อจากเดิมไหม?</h3><p>คุณทำ '+esc(q.name || q.title)+' ค้างไว้ที่ข้อ '+th(ip.i+1)+' จาก '+th(q.questions.length)+'</p><div class="row-btns"><button class="btn ghost" data-m="new">เริ่มใหม่</button><button class="btn" data-m="go">ทำต่อ</button></div>', function(m, close){
      m.querySelector('[data-m="new"]').onclick = function(){ close(); delete S.inprog[q.id]; save(); startQuiz(bid, qid, true); };
      m.querySelector('[data-m="go"]').onclick = function(){ close(); buildQuiz(b, q, ip); };
    });
    return;
  }
  buildQuiz(b, q, null);
}
function buildQuiz(b, q, resume){
  var qs = q.questions.map(function(x){
    var ans = Array.isArray(x.answer) ? x.answer : [x.answer];
    var ch = x.choices.map(function(t,i){ return {text:t, correct:ans.indexOf(i)>=0}; });
    return {q:x.q, explain:x.explain||"", img:x.img||null, passage:x.passage||"", multi:ans.length>1, choices: q.shuffle ? shuffle(ch) : ch};
  });
  if (q.shuffle) qs = shuffle(qs);
  quiz = {book:b, def:q, qs:qs, i:0, picks:[], picked:null, L:labelsOf(q)};
  if (resume){ quiz.i = resume.i; quiz.picks = resume.picks.slice(0, resume.i); }
  go("play", {}, stack[stack.length-1].view==="result");
}
function saveProgress(){
  if (!quiz || quiz.def.shuffle) return;
  if (!S.inprog) S.inprog = {};
  var nextI = quiz.picked!==null ? quiz.i+1 : quiz.i;
  if (nextI >= quiz.qs.length){ delete S.inprog[quiz.def.id]; }
  else if (nextI > 0) S.inprog[quiz.def.id] = {i:nextI, picks:quiz.picks.slice(0,nextI)};
  save();
}

VIEWS.play = function(){
  if (!quiz){ tab("home"); return; }
  var Q = quiz.qs[quiz.i], n = quiz.qs.length;
  var right = '<button class="icon-btn" data-a="quit" aria-label="ออกจากแบบทดสอบ">'+I.close+'</button>';

  h += '<main><div class="wrap">';
  h += '<div class="qhead"><div class="bar"><i style="width:'+(quiz.i/n*100)+'%"></i></div><span>ข้อ '+th(quiz.i+1)+' / '+th(n)+'</span></div>';
  if (Q.img && window.QUIZ_IMG && window.QUIZ_IMG[Q.img]) h += '<img class="qimg" alt="" src="'+window.QUIZ_IMG[Q.img]+'">';
  var stem = Q.q, ps = Q.passage || "";
  if (stem.indexOf("\n") >= 0){ var parts = stem.split("\n"); var last = parts.pop(); var head = parts.join("\n"); if (head.length > 120){ ps = (ps ? ps+"\n" : "") + head; stem = last; } }
  if (ps) h += '<div class="passage">'+inline(ps)+'</div>';
  h += '<p class="question">'+inline(stem).replace(/\n/g,'<br>')+'</p><div class="choices">';
  Q.choices.forEach(function(c,i){
    var cls = "";
    if (quiz.picked!==null){
      if (c.correct) cls = " right"; else if (i===quiz.picked) cls = " wrong"; else cls = " dim";
    }
    h += '<button class="choice'+cls+'" data-a="pick" data-i="'+i+'"'+(quiz.picked!==null?' disabled':'')+'><span class="k">'+quiz.L[i]+'</span><span>'+inline(c.text)+'</span></button>';
  });
  h += '</div>';
  if (quiz.picked!==null){
    var ok = Q.choices[quiz.picked].correct;
    var cl = []; Q.choices.forEach(function(c,k){ if (c.correct) cl.push(quiz.L[k]); });
    var head = ok ? 'ถูกต้อง!' + (Q.multi ? ' (ข้อนี้ถูกได้หลายข้อ: '+cl.join(', ')+')' : '') : 'ยังไม่ถูก · คำตอบที่ถูกคือข้อ '+cl.join(', ');
    h += '<div class="feedback '+(ok?'ok':'no')+'"><b>'+head+'</b>'+(Q.explain?'<div class="ex">'+inline(Q.explain)+'</div>':'')+'</div>';
    h += '<div style="margin-top:18px"><button class="btn block" data-a="nextq">'+(quiz.i<n-1?'ข้อต่อไป':'ดูผลคะแนน')+'</button></div>';
  }
  h += '</div></main>';
  app.innerHTML = h;
  if (quiz.picked!==null){ var f=app.querySelector(".feedback"); if (f && f.scrollIntoView) f.scrollIntoView({behavior:"smooth", block:"nearest"}); }
};

function finishQuiz(){
  var score = 0, details = [];
  quiz.qs.forEach(function(Q,k){
    var p = quiz.picks[k], ok = Q.choices[p].correct; if (ok){ score++; return; }
    var cs = []; Q.choices.forEach(function(c,j){ if (c.correct) cs.push(quiz.L[j]+'. '+c.text); });
    var qshort = Q.q.split("\n").pop();
    details.push({no:k+1, q:qshort, picked:quiz.L[p]+'. '+Q.choices[p].text, correct:cs.join(' / '), ok:false, explain:Q.explain});
  });
  if (S.inprog) delete S.inprog[quiz.def.id];
  var r = {id:String(Date.now()), quizId:quiz.def.id, bookId:quiz.book.id, quizTitle:quiz.book.title+' · '+(quiz.def.name || quiz.def.title), score:score, total:quiz.qs.length, date:new Date().toISOString(), name:S.name, details:details, wrongOnly:true};
  S.results.push(r); while (S.results.length>150) S.results.shift(); save();
  go("result", {id:r.id}, true);
}

function findResult(id){ for (var i=0;i<S.results.length;i++) if (S.results[i].id===id) return S.results[i]; return null; }

VIEWS.result = function(p){

VIEWS.review = function(p){

  var h = topbar(r.wrongOnly ? "ข้อที่ตอบผิด" : "เฉลย") + '<main><div class="wrap">';

/* ---------- ลองสอบจริง (exam mode) ---------- */
var ex = null, exTimer = null;
var SUBJ_ORDER = ["สัสดี","ภาษาอังกฤษ","ภาษาไทย","ศาสนาศีลธรรม"];
function fmtLeft(s){ s=Math.max(0,s|0); var h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+":":"")+(h&&m<10?"0":"")+m+":"+(x<10?"0":"")+x; }
function exSave(){ if (!ex) return; if (!S.exam) S.exam={}; S.exam[ex.def.id] = {ans:ex.ans.slice(), i:ex.i, left:ex.left}; save(); }
function startExam(b, q, fresh){
  var st = S.exam && S.exam[q.id];
  if (st && st.ans && st.ans.length !== q.questions.length){ delete S.exam[q.id]; save(); st = null; }
  if (st && !fresh){
    var n = st.ans.filter(function(a){ return a!=null; }).length;
    modal('<h3>ทำต่อจากเดิมไหม?</h3><p>'+esc(q.name||q.title)+' ตอบไปแล้ว '+th(n)+' ข้อ · เหลือเวลา '+fmtLeft(st.left)+'</p><div class="row-btns"><button class="btn ghost" data-m="new">เริ่มใหม่</button><button class="btn" data-m="go">ทำต่อ</button></div>', function(m, close){
      m.querySelector('[data-m="new"]').onclick = function(){ close(); delete S.exam[q.id]; save(); startExam(b, q, true); };
      m.querySelector('[data-m="go"]').onclick = function(){ close(); buildExam(b, q, st); };
    });
    return;
  }
  modal('<h3>'+esc(q.name||q.title)+'</h3><p>ข้อสอบ '+th(q.questions.length)+' ข้อ · เวลา '+th(q.minutes||120)+' นาที<br>เลือกคำตอบได้ เปลี่ยนได้ ข้ามได้ แล้วกด <b>ส่งคำตอบ</b> เมื่อทำเสร็จ<br>คะแนนรวม คะแนนแยกวิชา และเฉลยจะแสดงหลังส่ง</p><div class="row-btns"><button class="btn ghost" data-m="no">ยกเลิก</button><button class="btn" data-m="go">เริ่มสอบ</button></div>', function(m, close){
    m.querySelector('[data-m="no"]').onclick = close;
    m.querySelector('[data-m="go"]').onclick = function(){ close(); buildExam(b, q, null); };
  });
}
function buildExam(b, q, st){
  var qs = q.questions.map(function(x){ return {q:x.q, sub:x.sub||"", passage:x.passage||"", explain:x.explain||"", choices:x.choices, answer:x.answer}; });
  ex = {book:b, def:q, qs:qs, ans:st?st.ans.slice():new Array(qs.length).fill(null), i:st?Math.min(st.i,qs.length-1):0, left:st?st.left:(q.minutes||120)*60, L:labelsOf(q)};
  while (ex.ans.length < qs.length) ex.ans.push(null);
  exSave();
  go("exam", {}, false);
}
VIEWS.exam = function(){
  if (!ex){ tab("home"); return; }
  var Q = ex.qs[ex.i], n = ex.qs.length, done = ex.ans.filter(function(a){ return a!=null; }).length;
  var right = '<button class="icon-btn" data-a="xgrid" aria-label="ภาพรวมข้อสอบ">'+I.toc+'</button><button class="icon-btn" data-a="xquit" aria-label="ออก">'+I.close+'</button>';
  var h = topbar(ex.def.name || ex.def.title, {back:false, right:right});
  h += '<main><div class="wrap">';
  h += '<div class="xhead"><span class="xt" id="xtm">⏱ '+fmtLeft(ex.left)+'</span><span>ข้อ '+th(ex.i+1)+' / '+th(n)+'</span><span>ตอบแล้ว <b id="xdone">'+th(done)+'</b></span></div>';
  h += '<div class="qhead"><div class="bar"><i id="xbar" style="width:'+(done/n*100)+'%"></i></div></div>';
  if (Q.sub) h += '<span class="pill xsub">'+esc(Q.sub)+'</span>';
  var stem = Q.q, ps = Q.passage || "";
  if (ps) h += '<div class="passage">'+inline(ps).replace(/\n/g,'<br>')+'</div>';
  h += '<p class="question">'+inline(stem).replace(/\n/g,'<br>')+'</p><div class="choices">';
  Q.choices.forEach(function(c,i){
    h += '<button class="choice'+(ex.ans[ex.i]===i?' sel':'')+'" data-a="xpick" data-i="'+i+'"><span class="k">'+ex.L[i]+'</span><span>'+inline(c)+'</span></button>';
  });
  h += '</div><div class="row-btns" style="margin-top:22px">';
  h += '<button class="btn ghost" data-a="xmove" data-d="-1"'+(ex.i===0?' disabled':'')+'>‹ ข้อก่อน</button>';
  h += ex.i<n-1 ? '<button class="btn" data-a="xmove" data-d="1">ข้อต่อไป ›</button>' : '<button class="btn" data-a="xsubmit">ส่งคำตอบ</button>';
  h += '</div><div style="margin-top:10px"><button class="btn ghost block" data-a="xgrid">ดูภาพรวม / ส่งคำตอบ</button></div>';
  h += '</div></main>';
  app.innerHTML = h;
  clearInterval(exTimer);
  var tick = 0;
  exTimer = setInterval(function(){
    if (!ex){ clearInterval(exTimer); return; }
    ex.left--; tick++;
    var t = document.getElementById("xtm"); if (t){ t.textContent = "⏱ "+fmtLeft(ex.left); if (ex.left<=300) t.classList.add("low"); }
    if (tick%10===0) exSave();
    if (ex.left<=0){ clearInterval(exTimer); exSave(); closePanel(); modal('<h3>หมดเวลา</h3><p>ระบบส่งคำตอบให้อัตโนมัติ</p><button class="btn block" data-m="x">ดูผลคะแนน</button>', function(m, close){ m.querySelector('[data-m="x"]').onclick = function(){ close(); finishExam(); }; }); }
  }, 1000);
  cleanup = function(){ clearInterval(exTimer); exSave(); };
};
function exPick(i){
  ex.ans[ex.i] = (ex.ans[ex.i]===i ? null : i);
  app.querySelectorAll(".choice").forEach(function(el,k){ el.classList.toggle("sel", ex.ans[ex.i]===k); });
  var done = ex.ans.filter(function(a){ return a!=null; }).length;
  var d = document.getElementById("xdone"); if (d) d.textContent = th(done);
  var bar = document.getElementById("xbar"); if (bar) bar.style.width = (done/ex.qs.length*100)+"%";
  exSave();
}
function exGrid(){
  var n = ex.qs.length, done = ex.ans.filter(function(a){ return a!=null; }).length, g = '';
  ex.qs.forEach(function(Q,k){ if (Q.sub && (k===0 || ex.qs[k-1].sub!==Q.sub)) g += '<div class="xsec">'+esc(Q.sub)+'</div>'; g += '<button class="xg'+(ex.ans[k]!=null?' on':'')+(k===ex.i?' cur':'')+'" data-a="xjump" data-n="'+k+'">'+th(k+1)+'</button>'; });
  openPanel('<label>ตอบแล้ว '+th(done)+' / '+th(n)+' ข้อ · เหลือเวลา '+fmtLeft(ex.left)+'</label><div class="xgrid">'+g+'</div><button class="btn block" style="margin-top:14px" data-a="xsubmit">ส่งคำตอบ</button>');
}
function exSubmit(){
  var left = ex.ans.filter(function(a){ return a==null; }).length;
  closePanel();
  if (left) confirmBox("ยังไม่ได้ตอบ "+left+" ข้อ", "ข้อที่ไม่ได้ตอบจะนับเป็นผิด ต้องการส่งคำตอบเลยไหม?", "ส่งคำตอบ", finishExam);
  else confirmBox("ส่งคำตอบ?", "ตอบครบทุกข้อแล้ว ส่งเพื่อดูคะแนนและเฉลย", "ส่งคำตอบ", finishExam);
}
function finishExam(){
  clearInterval(exTimer);
  var score = 0, details = [], parts = {};
  ex.qs.forEach(function(Q,k){
    var a = ex.ans[k], ok = a===Q.answer, s = Q.sub || "อื่น ๆ";
    if (!parts[s]) parts[s] = {s:0, t:0}; parts[s].t++;
    if (ok){ score++; parts[s].s++; return; }
    details.push({no:k+1, q:(Q.sub?'['+Q.sub+'] ':'')+Q.q.split("\n").pop(), picked:a==null?'— ไม่ได้ตอบ —':ex.L[a]+'. '+Q.choices[a], correct:ex.L[Q.answer]+'. '+Q.choices[Q.answer], ok:false, explain:Q.explain});
  });
  var used = (ex.def.minutes||120)*60 - Math.max(0, ex.left);
  if (S.exam) delete S.exam[ex.def.id];
  var r = {id:String(Date.now()), quizId:ex.def.id, bookId:ex.book.id, quizTitle:(ex.def.name||ex.def.title), score:score, total:ex.qs.length, date:new Date().toISOString(), name:S.name, details:details, wrongOnly:true, parts:parts, used:used};
  S.results.push(r); while (S.results.length>150) S.results.shift();
  ex = null; save();
  stack = [{view:"home", params:{}}, {view:"subject", params:{id:r.bookId}}];
  go("result", {id:r.id});
}
function partsHtml(r){
  if (!r.parts) return '';
  var keys = Object.keys(r.parts).sort(function(a,b){ var i=SUBJ_ORDER.indexOf(a), j=SUBJ_ORDER.indexOf(b); return (i<0?9:i)-(j<0?9:j); });
  var h = '<div class="card xparts"><label>คะแนนแยกวิชา'+(r.used?' · ใช้เวลา '+fmtLeft(r.used):'')+'</label>';
  keys.forEach(function(k){ var p=r.parts[k], P=Math.round(p.s/p.t*100);
    h += '<div class="xp"><span>'+esc(k)+'</span><span class="bar"><i style="width:'+P+'%;background:'+(P>=80?'var(--ok)':P>=50?'var(--accent)':'var(--bad)')+'"></i></span><b>'+th(p.s+'/'+p.t)+'</b></div>'; });
  return h + '</div>';
}
function mockItem(b, q){
  var bs = best(q.id), n = attempts(q.id).length, st = S.exam && S.exam[q.id];
  var right = bs ? '<span class="score-chip '+chipClass(pct(bs))+'">'+th(bs.score+'/'+bs.total)+'</span>' : '<span class="pill">ยังไม่ได้ทำ</span>';
  var sub = th(qCount(q))+' ข้อ · '+th(q.minutes||120)+' นาที' + (st ? ' · <b style="display:inline;color:var(--accent);font-weight:600">ทำค้างไว้ เหลือ '+fmtLeft(st.left)+'</b>' : '') + (n?' · ทำแล้ว '+th(n)+' ครั้ง':'');
  return '<button class="item" data-a="quiz" data-b="'+b.id+'" data-q="'+q.id+'"><span class="n'+(bs?' done':'')+'">'+(bs?'✓':th(q.no||''))+'</span><span class="tx"><b>'+esc(q.title)+'</b><span>'+sub+'</span></span>'+right+'</button>';
}
function mockPage(s){
  var h = topbar(s.title) + '<main><div class="wrap">';
  h += '<div class="subj-hero" style="--c:'+esc(s.color)+'"><span class="ic">'+(SUBJ_ICON[s.icon]||"")+'</span><div><small>ข้อสอบเสมือนจริง</small><h2>'+esc(s.title)+'</h2></div></div>';
  h += '<div class="card" style="padding:16px 18px;margin-bottom:18px;line-height:1.6">'+(s.intro||'')+'</div>';
  h += '<div class="card list">'; (s.quizzes||[]).forEach(function(q){ h += mockItem(s,q); }); h += '</div>';
  h += '</div></main>';
  app.innerHTML = h;
}

/* ---------- modal / toast ---------- */
function modal(html, onReady){
  var m = document.createElement("div");
  m.className = "scrim";
  m.innerHTML = '<div class="card modal">'+html+'</div>';
  document.body.appendChild(m);
  function close(){ m.remove(); }
  m.addEventListener("click", function(e){ if (e.target===m) close(); });
  if (onReady) onReady(m, close);
  return close;
}
function confirmBox(title, text, okLabel, onOk){
  modal('<h3>'+esc(title)+'</h3><p>'+esc(text)+'</p><div class="row-btns"><button class="btn ghost" data-m="no">ยกเลิก</button><button class="btn" data-m="ok" style="background:var(--bad)">'+esc(okLabel)+'</button></div>', function(m, close){
    m.querySelector('[data-m="no"]').onclick = close;
    m.querySelector('[data-m="ok"]').onclick = function(){ close(); onOk(); };
  });
}
function askName(first){
  modal('<h3>'+(first?'ยินดีต้อนรับ':'เปลี่ยนชื่อ')+'</h3><p>ใส่ชื่อของคุณ ชื่อนี้จะแสดงในหน้าแรกและผลสอบ</p><form><input class="field" maxlength="40" placeholder="ชื่อ-นามสกุล หรือชื่อเล่น" value="'+esc(S.name)+'"><button class="btn block" type="submit">บันทึก</button></form>', function(m, close){
    var f = m.querySelector("form"), inp = m.querySelector("input");
    setTimeout(function(){ inp.focus(); }, 50);
    f.onsubmit = function(e){ e.preventDefault(); S.name = inp.value.trim(); save(); close(); show(); };
  });
}
function toast(t){ var d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 2200); }
function resultText(r){
  var lines = ["ผลสอบ: "+r.quizTitle, "ชื่อ: "+(r.name||"-"), "คะแนน: "+r.score+"/"+r.total+" ("+pct(r)+"%)", "วันที่: "+fmtDate(r.date)];
  var wrong = r.details.map(function(d,k){ return d.ok?null:(k+1); }).filter(Boolean);
  if (wrong.length) lines.push("ข้อที่ผิด: "+wrong.join(", "));
  return lines.join("\n");
}
function copyText(t){
  function fallback(){
    modal('<h3>คัดลอกผลสอบ</h3><p>กดค้างที่ข้อความแล้วเลือก "คัดลอก"</p><textarea class="field" style="min-height:140px;padding:12px" readonly>'+esc(t)+'</textarea><button class="btn block" data-m="x">ปิด</button>', function(m, close){
      var ta = m.querySelector("textarea"); ta.focus(); ta.select(); m.querySelector('[data-m="x"]').onclick = close;
    });
  }
  try { navigator.clipboard.writeText(t).then(function(){ toast("คัดลอกแล้ว ส่งให้ครูทาง LINE ได้เลย"); }, fallback); } catch(e){ fallback(); }
}

function isIOSBrowser(){
  var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  return ios && !window.navigator.standalone;
}

/* ---------- events ---------- */
app.addEventListener("click", handle);
document.body.addEventListener("click", function(e){ if (panelEl && panelEl.contains(e.target)) handle(e); });
function handle(e){
  var el = e.target.closest("[data-a]"); if (!el) return;
  var a = el.dataset.a, d = el.dataset;
  switch(a){
    case "back": back(); break;
    case "tab": quiz=null; tab(d.v); break;
    case "subject": go("subject", {id:d.b}); break;
    case "sums": go("sums", {id:d.b}); break;
    case "quizlist": go("quizlist", {id:d.b}); break;
    case "go-scores": go("scores"); break;
    case "read": go("reader", {id:d.b, ch:+d.c}, d.replace==="1" || (stack[stack.length-1].view==="reader")); break;
    case "next": { var p=prog(d.b); p.read[+d.c-1]=true; p.scroll[+d.c]=0; save(); go("reader", {id:d.b, ch:+d.c}, true); break; }
    case "finish": { var b=book(d.b); prog(d.b).read[b.chapters.length-1]=true; save(); back(); break; }
    case "finish-quiz": { var b2=book(d.b); prog(d.b).read[b2.chapters.length-1]=true; save(); stack.pop(); if (stack[stack.length-1].view==="sums") stack.pop(); go("quizlist", {id:d.b}); break; }
    case "retry-pdf": show(); break;
    case "aa": aaPanel(); break;
    case "toc": tocPanel(); break;
    case "fs": S.fontSize = Math.max(14, Math.min(34, S.fontSize + (+d.d))); save(); document.documentElement.style.setProperty("--fs", S.fontSize+"px"); aaPanel(); break;
    case "theme": S.theme = d.t; save(); document.documentElement.setAttribute("data-theme", S.theme); document.querySelectorAll(".pp canvas").forEach(function(cv){ cv.style.filter = S.theme==="dark" ? "invert(1) hue-rotate(180deg)" : "none"; }); aaPanel(); break;
    case "quiz": case "retry": startQuiz(d.b, d.q); break;
    case "pick": if (quiz && quiz.picked===null){ quiz.picked = +d.i; quiz.picks[quiz.i] = +d.i; saveProgress(); show(); } break;
    case "nextq": if (quiz.i < quiz.qs.length-1){ quiz.i++; quiz.picked=null; show(); window.scrollTo(0,0); } else finishQuiz(); break;
    case "quit": confirmBox("ออกจากแบบทดสอบ?", quiz && !quiz.def.shuffle ? "ระบบจำไว้ว่าทำถึงข้อไหน กลับมาทำต่อได้ภายหลัง" : "คำตอบที่ทำไว้จะไม่ถูกบันทึก", "ออก", function(){ quiz=null; if (stack.length>1) back(); else tab("home"); }); break;
    case "review": go("review", {id:d.r}); break;
    case "xpick": if (ex) exPick(+d.i); break;
    case "xmove": if (ex){ ex.i = Math.max(0, Math.min(ex.qs.length-1, ex.i + (+d.d))); exSave(); show(); } break;
    case "xgrid": if (ex) exGrid(); break;
    case "xjump": if (ex){ closePanel(); ex.i = +d.n; exSave(); show(); } break;
    case "xsubmit": if (ex) exSubmit(); break;
    case "xquit": confirmBox("ออกจากห้องสอบ?", "ระบบบันทึกคำตอบและเวลาที่เหลือไว้ กลับมาทำต่อได้ภายหลัง (เวลาหยุดเดินระหว่างออก)", "ออก", function(){ exSave(); clearInterval(exTimer); ex=null; if (stack.length>1) back(); else tab("home"); }); break;
    case "copy": { var r=findResult(d.r); if (r) copyText(resultText(r)); break; }
    case "clear": confirmBox("ล้างประวัติการสอบ?", "ผลสอบทั้งหมดในเครื่องนี้จะถูกลบ และกู้คืนไม่ได้", "ล้างประวัติ", function(){ S.results=[]; save(); show(); }); break;
    case "name": askName(false); break;
    case "hidehint": S.hideHint = true; save(); show(); break;
  }
}

stack = [{view:"home", params:{}}];
show();

if ("serviceWorker" in navigator && location.protocol === "https:") {
  try { navigator.serviceWorker.register("sw.js").catch(function(){}); } catch(e){}
}
})();
</script>
