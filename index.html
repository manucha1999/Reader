<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ชั้นหนังสือของฉัน</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#b5532f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="หนังสือ">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf7f2;--fg:#2b2622;--card:#fff;--line:#e4ddd2;--acc:#b5532f;--mut:#8a8176}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b19;--fg:#ece6dc;--card:#2a2724;--line:#3d3833;--acc:#e08a63;--mut:#a39a8f}}
:root[data-theme="dark"]{--bg:#1d1b19;--fg:#ece6dc;--card:#2a2724;--line:#3d3833;--acc:#e08a63;--mut:#a39a8f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:1.2rem;margin:0;flex:1}
main{max-width:960px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.book{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
.book b{display:block;word-break:break-word}
.bar{height:6px;background:var(--line);border-radius:3px;margin:8px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
small{color:var(--mut)}
.empty{text-align:center;padding:48px 16px;color:var(--mut)}
#reader{display:none}
.tools{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 0;z-index:5}
.tools input[type=number]{width:64px;padding:5px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.wrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.pg{flex:1 1 480px;min-width:0;overflow-x:auto;text-align:center}
canvas{max-width:100%;box-shadow:0 2px 12px #0003;background:#fff}
.dark canvas{filter:invert(1) hue-rotate(180deg)}
aside{flex:1 1 240px;max-width:100%}
textarea{width:100%;min-height:120px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.note{border-left:3px solid var(--acc);padding:4px 8px;margin:6px 0;cursor:pointer;background:var(--card);border-radius:0 8px 8px 0;font-size:.9rem}
#box{position:relative;display:inline-block;line-height:0}#box canvas{display:block}
#hl,#tl{position:absolute;inset:0}#hl{pointer-events:none}
#hl i{position:absolute;background:#ffd84a;opacity:.45;mix-blend-mode:multiply}
#tl{line-height:1;overflow:hidden;text-align:left}#tl span{position:absolute;white-space:pre;color:transparent;transform-origin:0 0}
#tl ::selection{background:#3b82f64d}
.tools button{min-height:40px}
aside input[type=search]{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.x{float:right;padding:0 6px}details{margin:8px 0}
#bk{display:none;padding:12px 16px;border-bottom:1px solid var(--line)}#bk textarea{min-height:90px;margin:6px 0}
@media (max-width:600px){main{padding:10px}.tools{gap:4px}}
.chip{margin:0 6px 8px 0}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.mt{width:100%;border-collapse:collapse;table-layout:fixed;background:var(--card)}
.mt th,.mt td{border:1px solid var(--line);padding:6px 4px;text-align:center;vertical-align:middle}
.mt th{font-size:1rem}.mt .sj{font-weight:600;word-break:break-word}
.mt button{display:block;width:100%;margin:3px 0;padding:6px 4px;font-size:.8rem;line-height:1.3;white-space:normal;word-break:break-word;text-align:left}
.mt .pl{color:var(--mut)}
.ch{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;font-size:1rem;line-height:1.4}
.ch.ok{background:#2e7d32;color:#fff;border-color:#2e7d32;opacity:1}.ch.no{background:#c62828;color:#fff;border-color:#c62828;opacity:1}
#qbody .note{white-space:pre-line}.big{font-size:2rem;font-weight:700;text-align:center;margin:12px 0}
</style>
</head>
<body>
<header>
  <h1 id="title">📚 ชั้นหนังสือของฉัน</h1>
  <button id="bkb">สำรอง/กู้คืน</button><button id="theme">🌓</button>
</header>
<div id="bk"><small>คัดลอกข้อความนี้เก็บไว้ (โน้ต ไฮไลต์ ความคืบหน้า ไม่รวมไฟล์ PDF) หรือวางข้อมูลจากอีกเครื่องแล้วกดนำเข้า ต้องเพิ่ม PDF เล่มเดิมชื่อเดียวกันในเครื่องนี้ก่อน</small><textarea id="bkt"></textarea><button id="bki" class="p">นำเข้า</button> <button id="bkc">ปิด</button></div>
<main>
<section id="shelf">
  <p><button class="p" id="add">+ เพิ่ม PDF / แบบทดสอบ</button> <button id="vw"></button><input id="file" type="file" accept="application/pdf,application/json,.json" multiple hidden></p>
  <div id="mat"></div>
  <div id="chips"></div>
  <div class="grid" id="grid"></div>
  <div class="grid" id="qgrid" style="margin-top:12px"></div>
</section>
<section id="reader">
  <div class="tools">
    <button id="back">← ชั้นหนังสือ</button>
    <button id="prev">‹</button>
    <input id="pn" type="number" min="1"><small id="tot"></small>
    <button id="next">›</button>
    <button id="zo">−</button><button id="zi">+</button>
    <button id="dk">โหมดมืด</button><button id="hb">🖍 ไฮไลต์</button>
  </div>
  <div class="wrap">
    <div class="pg"><div id="box"><canvas id="cv"></canvas><div id="hl"></div><div id="tl"></div></div></div>
    <aside>
      <b>โน้ตหน้านี้</b>
      <textarea id="note" placeholder="จดอะไรไว้ตรงนี้…"></textarea>
      <p><b>ค้นหาในเล่ม</b></p><input id="q" type="search" placeholder="พิมพ์คำแล้วกด Enter"><div id="qr"></div><details><summary><b>สารบัญ</b></summary><div id="toc"></div></details><p><b>ไฮไลต์และโน้ตทั้งหมด</b></p><div id="notes"></div>
    </aside>
  </div>
</section>
<section id="qz" style="display:none">
  <div class="tools"><button id="qback">← กลับ</button><b id="qt"></b><small id="qp"></small></div>
  <div id="qbody"></div>
</section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js"></script>
<script>
const $=id=>document.getElementById(id);
pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';
let db=null,mem={books:{},notes:{}};
function open(){return new Promise(r=>{try{const q=indexedDB.open('reader',1);
q.onupgradeneeded=()=>{q.result.createObjectStore('books',{keyPath:'id'});q.result.createObjectStore('notes',{keyPath:'key'})};
q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
function st(s,m='readonly'){return db.transaction(s,m).objectStore(s)}
const req=q=>new Promise(r=>{q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});
async function all(s){return db?await req(st(s).getAll())||[]:Object.values(mem[s])}
async function put(s,v){if(db)await req(st(s,'readwrite').put(v));else mem[s][v.id||v.key]=v}
async function del(s,k){if(db)await req(st(s,'readwrite').delete(k));else delete mem[s][k]}

let subs=[],cur='all';try{subs=JSON.parse(localStorage.getItem('subs')||'[]')}catch(e){}
const saveSubs=()=>{try{localStorage.setItem('subs',JSON.stringify(subs))}catch(e){}};
let types=['หนังสือ','ShotNote','แบบทดสอบ'],gt='สอบสัสดี 70',view='grid',pend=null;
try{types=JSON.parse(localStorage.getItem('types'))||types;gt=localStorage.getItem('gt')||gt;view=localStorage.getItem('view')||view}catch(e){}
const ls=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let book=null,pdf=null,page=1,zoom=1,dark=false,timer,texts=null,lastSel=null;

async function shelf(){
  $('reader').style.display='none';$('qz').style.display='none';$('shelf').style.display='block';$('title').textContent='📚 '+gt;
  const gv=view==='grid';$('chips').style.display=gv?'none':'';$('mat').style.display=gv?'block':'none';chips();renderQz();const bs=(await all('books')).sort((a,b)=>b.added-a.added).filter(b=>gv||cur==='all'||(cur==='none'?!b.subject:b.subject===cur));
  if(gv)matrix(bs);$('grid').innerHTML=bs.length?'':'<div class="empty">ยังไม่มีหนังสือ กด “เพิ่มหนังสือ” เพื่อเริ่มต้น</div>';
  bs.forEach(b=>{
    const d=document.createElement('div');d.className='book';
    const pct=b.total?Math.round(b.page/b.total*100):0;
    d.innerHTML=`<b></b><div class="bar"><i style="width:${pct}%"></i></div><small>หน้า ${b.page}/${b.total||'?'} · ${pct}%</small><br><button class="mv">วิชา</button> <button class="rm">ลบ</button>`;
    const sj=subs.find(x=>x.n===b.subject);d.querySelector('b').textContent=(sj?sj.e+' ':'')+b.name;
    d.onclick=()=>openBook(b);
    d.querySelector('.mv').onclick=e=>{e.stopPropagation();pick(b)};
    d.querySelector('.rm').onclick=async e=>{e.stopPropagation();if(confirm('ลบ “'+b.name+'” ?')){await del('books',b.id);for(const n of await all('notes'))if(n.id===b.id)await del('notes',n.key);shelf()}};
    $('grid').appendChild(d);
  });
}
$('add').onclick=()=>{pend=null;$('file').click()};
$('file').onchange=async e=>{
  for(const f of e.target.files){
    if(/\.json$/i.test(f.name)){try{const d=JSON.parse(await f.text());
      if(!Array.isArray(d.questions)||!d.questions.length||d.questions.some(q=>!q.q||!Array.isArray(q.choices)||typeof q.answer!=='number'))throw 0;
      qz.push({id:Date.now()+Math.random().toString(36).slice(2,6),name:d.title||f.name.replace(/\.json$/i,''),questions:d.questions,subject:pend?pend.s:(subs.some(x=>x.n===cur)?cur:''),type:pend?pend.t:''});saveQz()}
      catch(err){alert('ไฟล์แบบทดสอบไม่ถูกต้อง: '+f.name)}continue}
    const blob=new Blob([await f.arrayBuffer()],{type:'application/pdf'});
    await put('books',{id:Date.now()+Math.random().toString(36).slice(2,6),name:f.name.replace(/\.pdf$/i,''),blob,page:1,total:0,added:Date.now(),subject:pend?pend.s:(subs.some(x=>x.n===cur)?cur:''),type:pend?pend.t:''});
  }
  e.target.value='';pend=null;shelf();
};
function matrix(bs){const m=$('mat');m.innerHTML='';
  const bar=document.createElement('p');
  [['+ วิชา (แถว)',newSub],['✎ หัวคอลัมน์',editCols],['📥 ข้อสอบสำเร็จรูป',webQuizzes]].forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=f;bar.append(b,' ')});m.appendChild(bar);
  if(!subs.length){m.insertAdjacentHTML('beforeend','<div class="empty">กด “+ วิชา (แถว)” เพื่อสร้างแถวของตาราง</div>');return}
  const t=document.createElement('table');t.className='mt';
  const hr=t.insertRow();hr.appendChild(document.createElement('th'));types.forEach(x=>{const h=document.createElement('th');h.textContent=x;hr.appendChild(h)});
  subs.forEach(s=>{const r=t.insertRow(),c0=r.insertCell();c0.className='sj';c0.textContent=s.e+' '+s.n;c0.style.cursor='pointer';c0.onclick=()=>{cur=s.n;editSub()};
    types.forEach(ty=>{const c=r.insertCell();
      bs.filter(b=>b.subject===s.n&&b.type===ty).forEach(b=>{const x=document.createElement('button'),pct=b.total?Math.round(b.page/b.total*100):0;x.textContent='📖 '+b.name+(pct?' · '+pct+'%':'');x.title=b.name;x.onclick=()=>openBook(b);c.appendChild(x)});
      qz.filter(z=>z.subject===s.n&&z.type===ty).forEach(z=>{const x=document.createElement('button');x.textContent='📝 '+z.name+(z.best!=null?' · ดีสุด '+z.best+'/'+z.questions.length:'');x.onclick=()=>openQuiz(z);c.appendChild(x)});
      const a=document.createElement('button');a.className='pl';a.textContent='+';a.onclick=()=>{pend={s:s.n,t:ty};$('file').click()};c.appendChild(a)})});
  m.appendChild(t);m.insertAdjacentHTML('beforeend','<p><small>แตะชื่อวิชาเพื่อแก้ไข/ลบ · แตะ + เพื่อเพิ่ม PDF ลงช่องนั้น · หนังสือทั้งหมดและปุ่มย้าย/ลบอยู่ด้านล่าง</small></p>')}
async function editCols(){const r=prompt('หัวคอลัมน์ (คั่นด้วยเครื่องหมายจุลภาค ,)',types.join(', '));if(r===null)return;
  const n=r.split(',').map(x=>x.trim()).filter(Boolean);if(!n.length)return;
  for(const b of await all('books')){const i=types.indexOf(b.type);if(i>=0){b.type=n[i]||'';await put('books',b)}}
  qz.forEach(z=>{const i=types.indexOf(z.type);if(i>=0)z.type=n[i]||''});saveQz();types=n;ls('types',JSON.stringify(types));shelf()}
$('vw').onclick=()=>{view=view==='grid'?'list':'grid';ls('view',view);$('vw').textContent=view==='grid'?'มุมมองรายการ':'มุมมองตาราง';shelf()};
$('vw').textContent=view==='grid'?'มุมมองรายการ':'มุมมองตาราง';
$('title').onclick=()=>{if($('shelf').style.display==='none')return;const r=prompt('ชื่อชั้นหนังสือ',gt);if(r&&r.trim()){gt=r.trim();ls('gt',gt);shelf()}};
let qz=[];try{qz=JSON.parse(localStorage.getItem('qz')||'[]')}catch(e){}
const saveQz=()=>ls('qz',JSON.stringify(qz));
let Q=null;
async function webQuizzes(){try{const idx=await(await fetch('quizzes.json',{cache:'no-store'})).json();
  const a=prompt('เลือกแบบทดสอบที่จะเพิ่ม (พิมพ์เลข)\n'+idx.map((x,i)=>(i+1)+'. '+x.title).join('\n'));const x=idx[(+a)-1];if(!x)return;
  if(qz.some(z=>z.name===x.title)){alert('มีแบบทดสอบนี้ในชั้นแล้ว');return}
  const d=await(await fetch(x.file,{cache:'no-store'})).json();
  if(x.subject&&!subs.some(y=>y.n===x.subject)){subs.push({n:x.subject,e:x.emoji||'📘'});saveSubs()}
  qz.push({id:Date.now()+Math.random().toString(36).slice(2,6),name:x.title,questions:d.questions,subject:x.subject||'',type:x.type||''});saveQz();shelf()}
  catch(e){alert('โหลดแบบทดสอบไม่ได้ (ต้องต่ออินเทอร์เน็ต): '+((e&&e.message)||e))}}
function renderQz(){const o=$('qgrid');o.innerHTML='';
  qz.filter(z=>view==='grid'||cur==='all'||(cur==='none'?!z.subject:z.subject===cur)).forEach(z=>{
    const d=document.createElement('div');d.className='book';const sj=subs.find(x=>x.n===z.subject);
    d.innerHTML='<b></b><small></small><br><button class="mv">วิชา</button> <button class="rm">ลบ</button>';
    d.querySelector('b').textContent='📝 '+(sj?sj.e+' ':'')+z.name;
    d.querySelector('small').textContent=z.questions.length+' ข้อ'+(z.best!=null?' · ดีที่สุด '+z.best+'/'+z.questions.length:' · ยังไม่เคยทำ');
    d.onclick=()=>openQuiz(z);
    d.querySelector('.mv').onclick=e=>{e.stopPropagation();pick(z)};
    d.querySelector('.rm').onclick=e=>{e.stopPropagation();if(confirm('ลบแบบทดสอบ “'+z.name+'” ?')){qz=qz.filter(y=>y!==z);saveQz();shelf()}};
    o.appendChild(d)})}
function showQz(t){$('shelf').style.display='none';$('reader').style.display='none';$('qz').style.display='block';$('title').textContent='📝 '+t}
function openQuiz(z){showQz(z.name);$('qt').textContent='';$('qp').textContent='';const o=$('qbody');o.innerHTML='';
  const n=z.questions.length;
  o.insertAdjacentHTML('beforeend','<p class="big">'+n+' ข้อ</p><p style="text-align:center"><small>'+(z.last?'ครั้งล่าสุด '+z.last.score+'/'+z.last.total+' · ':'')+(z.best!=null?'ดีที่สุด '+z.best+'/'+n:'ยังไม่เคยทำ')+'</small></p>');
  const add=(l,f,p)=>{const b=document.createElement('button');b.className='ch'+(p?' p':'');b.style.textAlign='center';b.textContent=l;b.onclick=f;o.appendChild(b)};
  add('เริ่มทำตามลำดับ',()=>startQuiz(z,'seq'),1);add('เริ่มทำแบบสุ่มลำดับข้อ',()=>startQuiz(z,'rand'));
  if(z.lastWrong&&z.lastWrong.length)add('ทำเฉพาะข้อที่ผิดครั้งล่าสุด ('+z.lastWrong.length+' ข้อ)',()=>startQuiz(z,'wrong'))}
function startQuiz(z,mode){let idx=z.questions.map((_,i)=>i);
  if(mode==='wrong')idx=(z.lastWrong||[]).slice();
  if(mode!=='seq')idx.sort(()=>Math.random()-.5);
  Q={z,idx,i:0,score:0,wrong:[],full:mode!=='wrong'};showQz(z.name);showQ()}
function showQ(){const z=Q.z,k=Q.idx[Q.i],q=z.questions[k],L='กขคง';
  $('qp').textContent=' '+(Q.i+1)+'/'+Q.idx.length+' · ถูก '+Q.score;
  const o=$('qbody');o.innerHTML='';
  const h=document.createElement('p');h.style.fontWeight='600';h.textContent=(Q.i+1)+'. '+q.q;o.appendChild(h);
  let done=false;const ex=document.createElement('div');ex.className='note';ex.style.display='none';
  const nx=document.createElement('button');nx.className='p ch';nx.style.display='none';nx.style.textAlign='center';
  nx.textContent=Q.i+1<Q.idx.length?'ข้อถัดไป →':'ดูผลคะแนน';nx.onclick=()=>{Q.i++;Q.i<Q.idx.length?showQ():endQ();window.scrollTo(0,0)};
  const bs=q.choices.map((t,j)=>{const b=document.createElement('button');b.className='ch';b.textContent=(L[j]||j+1)+'. '+t;
    b.onclick=()=>{if(done)return;done=true;const ok=j===q.answer;if(ok)Q.score++;else Q.wrong.push(k);
      bs.forEach((x,m)=>{x.disabled=true;if(m===q.answer)x.classList.add('ok');else if(m===j)x.classList.add('no')});
      $('qp').textContent=' '+(Q.i+1)+'/'+Q.idx.length+' · ถูก '+Q.score;
      ex.textContent=(ok?'✅ ถูกต้อง':'❌ ไม่ถูก คำตอบที่ถูกคือ '+(L[q.answer]||q.answer+1)+'. '+q.choices[q.answer])+(q.explain?'\n'+q.explain:'');
      ex.style.display='block';nx.style.display='block'};
    o.appendChild(b);return b});
  o.appendChild(ex);o.appendChild(nx)}
function endQ(){const z=Q.z,n=Q.idx.length,pct=Math.round(Q.score/n*100),L='กขคง';
  if(Q.full){z.last={score:Q.score,total:n};if(z.best==null||Q.score>z.best)z.best=Q.score}
  z.lastWrong=Q.wrong.slice();saveQz();$('qp').textContent='';
  const o=$('qbody');o.innerHTML='<p class="big">'+Q.score+' / '+n+'</p><p style="text-align:center">'+pct+'% '+(pct>=80?'🎉 ยอดเยี่ยม':pct>=60?'👍 ใช้ได้ ทบทวนอีกนิด':'📖 ลองทบทวนแล้วทำใหม่')+'</p>';
  const add=(l,f,p)=>{const b=document.createElement('button');b.className='ch'+(p?' p':'');b.style.textAlign='center';b.textContent=l;b.onclick=f;o.appendChild(b)};
  if(Q.wrong.length)add('ทำเฉพาะข้อที่ผิด ('+Q.wrong.length+' ข้อ)',()=>startQuiz(z,'wrong'),1);
  add('ทำใหม่แบบสุ่มลำดับ',()=>startQuiz(z,'rand'));add('กลับชั้นหนังสือ',shelf);
  if(Q.wrong.length){o.insertAdjacentHTML('beforeend','<h3>ข้อที่ผิด</h3>');
    Q.wrong.forEach(k=>{const q=z.questions[k],d=document.createElement('div');d.className='note';
      d.textContent=q.q+'\n→ '+(L[q.answer]||q.answer+1)+'. '+q.choices[q.answer]+(q.explain?'\n'+q.explain:'');o.appendChild(d)})}
  window.scrollTo(0,0)}
$('qback').onclick=()=>{if(Q&&$('qp').textContent&&!confirm('ออกจากแบบทดสอบ? คะแนนรอบนี้จะไม่ถูกบันทึก'))return;Q=null;shelf()};
function chips(){const o=$('chips');o.innerHTML='';
  const add=(k,l,f)=>{const c=document.createElement('button');c.className='chip'+(cur===k?' on':'');c.textContent=l;c.onclick=f||(()=>{cur=k;shelf()});o.appendChild(c)};
  add('all','ทั้งหมด');subs.forEach(x=>add(x.n,x.e+' '+x.n));add('none','ไม่มีวิชา');add('+','+ วิชา',newSub);
  if(subs.some(x=>x.n===cur))add('ed','✎ แก้ไขวิชานี้',editSub)}
function newSub(){const n=(prompt('ชื่อวิชา')||'').trim();if(!n||subs.some(x=>x.n===n))return;
  subs.push({n,e:(prompt('อีโมจิไอคอนของวิชา (เช่น 📐 🧪 📖)','📘')||'📘').trim()});saveSubs();cur=n;shelf()}
async function editSub(){const x=subs.find(y=>y.n===cur);if(!x)return;
  const n=(prompt('ชื่อใหม่ (เว้นว่าง = คงเดิม, พิมพ์ ลบ = ลบวิชานี้)',x.n)||'').trim();
  if(n==='ลบ'){if(!confirm('ลบวิชา “'+x.n+'” ? หนังสือในวิชานี้จะย้ายไป “ไม่มีวิชา”'))return;
    for(const b of await all('books'))if(b.subject===x.n){b.subject='';await put('books',b)}qz.forEach(z=>{if(z.subject===x.n)z.subject=''});saveQz();subs=subs.filter(y=>y!==x);saveSubs();cur='all';return shelf()}
  const e=(prompt('อีโมจิไอคอน',x.e)||x.e).trim();
  if(n&&n!==x.n&&!subs.some(y=>y.n===n)){for(const b of await all('books'))if(b.subject===x.n){b.subject=n;await put('books',b)}qz.forEach(z=>{if(z.subject===x.n)z.subject=n});saveQz();x.n=n;cur=n}
  x.e=e;saveSubs();shelf()}
function pick(b){const t=subs.map((x,i)=>(i+1)+'. '+x.e+' '+x.n).join('\n');
  if(!subs.length){alert('ยังไม่มีวิชา กด “+ วิชา” เพื่อสร้างก่อน');return}
  const r=prompt('ย้าย “'+b.name+'” ไปวิชาที่ (พิมพ์เลข, 0 = ไม่มีวิชา)\n'+t);if(r===null)return;
  const i=+r;b.subject=i>0&&subs[i-1]?subs[i-1].n:'';
  if(b.subject){const r2=prompt('ประเภทของ “'+b.name+'” (พิมพ์เลข)\n'+types.map((x,k)=>(k+1)+'. '+x).join('\n'));b.type=types[(+r2)-1]||''}else b.type='';
  (b.questions?(saveQz(),Promise.resolve()):put('books',b)).then(shelf)}
async function openBook(b){
  $('title').textContent='กำลังเปิด…';draw.err=0;
  try{const task=pdfjsLib.getDocument({data:new Uint8Array(await b.blob.arrayBuffer()),disableWorker:true,cMapUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/cmaps/',cMapPacked:true,useSystemFonts:true});
    task.onPassword=(cb,why)=>{const p=prompt(why===2?'รหัสผ่านไม่ถูกต้อง ลองอีกครั้ง':'ไฟล์นี้มีรหัสผ่าน ใส่รหัส');if(p===null)task.destroy();else cb(p)};
    pdf=await task.promise}catch(e){$('title').textContent='📚 '+gt;alert('เปิดไฟล์ไม่ได้: '+((e&&e.message)||e)+'\n('+b.name+')');return}
  book=b;b.total=pdf.numPages;page=Math.min(b.page||1,pdf.numPages);
  $('shelf').style.display='none';$('reader').style.display='block';$('title').textContent=b.name;
  $('tot').textContent=' / '+pdf.numPages;$('pn').max=pdf.numPages;texts=null;$('qr').innerHTML='';$('q').value='';loadToc();
  await go(page);
}
let rendering=false,pending=null;
async function go(n){
  page=Math.max(1,Math.min(pdf.numPages,n));lastSel=null;$('pn').value=page;
  book.page=page;put('books',book);
  const nt=(await req(db?st('notes').get(book.id+':'+page):{onsuccess:0}))||mem.notes[book.id+':'+page];
  $('note').value=nt?nt.text:'';
  draw();listNotes();
}
async function draw(){
  if(rendering){pending=true;return}
  rendering=true;
  try{
    const p=await pdf.getPage(page),w=Math.min($('reader').querySelector('.pg').clientWidth||600,900);
    const base=p.getViewport({scale:1}),sc=(w/base.width)*zoom;let r=devicePixelRatio||1;
    const k=Math.sqrt(12e6/(base.width*sc*r*base.height*sc*r));if(k<1)r*=k;
    const v=p.getViewport({scale:sc*r});
    const c=$('cv');c.width=v.width;c.height=v.height;c.style.width=base.width*sc+'px';
    await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
    const tl=$('tl');tl.innerHTML='';
    try{await pdfjsLib.renderTextLayer({textContent:await p.getTextContent(),container:tl,viewport:p.getViewport({scale:sc}),textDivs:[]}).promise}catch(e){}
    drawHl();
  }catch(e){if(!draw.err){draw.err=1;alert('แสดงหน้านี้ไม่ได้: '+((e&&e.message)||e))}}
  finally{rendering=false;if(pending){pending=null;draw()}}
}
async function listNotes(){
  const ns=(await all('notes')).filter(n=>n.id===book.id&&(n.kind||n.text.trim())).sort((a,b)=>a.page-b.page);
  $('notes').innerHTML=ns.length?'':'<small>ยังไม่มีโน้ต</small>';
  ns.forEach(n=>{const d=document.createElement('div');d.className='note';
    d.innerHTML='<small>'+(n.kind?'🖍 ':'')+'หน้า '+n.page+'</small>'+(n.kind?'<button class="x">✕</button>':'')+'<br>';d.append(n.text.slice(0,120));d.onclick=()=>go(n.page);
    if(n.kind)d.querySelector('.x').onclick=async e=>{e.stopPropagation();await del('notes',n.key);listNotes();drawHl()};
    $('notes').appendChild(d)});
}
$('note').oninput=()=>{clearTimeout(timer);timer=setTimeout(async()=>{
  await put('notes',{key:book.id+':'+page,id:book.id,page,text:$('note').value});listNotes()},400)};
$('prev').onclick=()=>go(page-1);$('next').onclick=()=>go(page+1);
$('pn').onchange=()=>go(+$('pn').value||1);
$('zi').onclick=()=>{zoom=Math.min(2.5,zoom+.15);draw()};
$('zo').onclick=()=>{zoom=Math.max(.5,zoom-.15);draw()};
$('dk').onclick=()=>{dark=!dark;$('reader').classList.toggle('dark',dark)};
$('back').onclick=shelf;
$('theme').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#1d1b19';r.dataset.theme=d?'light':'dark'};
document.addEventListener('keydown',e=>{if(!book||$('reader').style.display==='none'||e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight')go(page+1);if(e.key==='ArrowLeft')go(page-1)});
function drawHl(){const h=$('hl');h.innerHTML='';all('notes').then(ns=>ns.filter(n=>n.kind&&n.id===book.id&&n.page===page).forEach(n=>n.rects.forEach(r=>{const i=document.createElement('i');i.style.cssText=`left:${r[0]*100}%;top:${r[1]*100}%;width:${r[2]*100}%;height:${r[3]*100}%`;h.appendChild(i)})))}
document.addEventListener('selectionchange',()=>{const s=getSelection();if(!s.rangeCount||s.isCollapsed||!$('box'))return;const r=s.getRangeAt(0),b=$('box').getBoundingClientRect();if(!$('box').contains(r.commonAncestorContainer)||!b.width)return;
  const rs=[...r.getClientRects()].filter(q=>q.width>1).map(q=>[(q.left-b.left)/b.width,(q.top-b.top)/b.height,q.width/b.width,q.height/b.height]);if(rs.length)lastSel={text:s.toString().trim(),rects:rs}});
$('hb').onclick=async()=>{if(!lastSel){alert('เลือกข้อความบนหน้า (แตะค้างหรือลากคลุม) ก่อน แล้วกดไฮไลต์');return}
  await put('notes',{key:book.id+':h:'+Date.now(),id:book.id,page,kind:'h',text:lastSel.text,rects:lastSel.rects});lastSel=null;getSelection().removeAllRanges();drawHl();listNotes()};
$('q').onkeydown=async e=>{if(e.key!=='Enter')return;const q=e.target.value.trim().toLowerCase();if(!q)return;const o=$('qr');
  if(!texts){texts=[];for(let i=1;i<=pdf.numPages;i++){o.textContent='กำลังอ่านหน้า '+i+'/'+pdf.numPages;texts.push((await(await pdf.getPage(i)).getTextContent()).items.map(t=>t.str).join(' '))}}
  o.innerHTML='';let n=0;texts.forEach((t,i)=>{const k=t.toLowerCase().indexOf(q);if(k<0||n>=40)return;n++;const d=document.createElement('div');d.className='note';d.innerHTML='<small>หน้า '+(i+1)+'</small><br>';d.append('…'+t.slice(Math.max(0,k-30),k+60)+'…');d.onclick=()=>go(i+1);o.appendChild(d)});if(!n)o.innerHTML='<small>ไม่พบคำนี้</small>'};
async function loadToc(){const o=$('toc');o.innerHTML='';let ol=null;try{ol=await pdf.getOutline()}catch(e){}
  if(!ol||!ol.length){o.innerHTML='<small>เล่มนี้ไม่มีสารบัญ</small>';return}
  const walk=(items,lv)=>items.forEach(it=>{const d=document.createElement('div');d.className='note';d.style.marginLeft=lv*12+'px';d.textContent=it.title;
    d.onclick=async()=>{try{let de=it.dest;if(typeof de==='string')de=await pdf.getDestination(de);go(await pdf.getPageIndex(de[0])+1)}catch(e){}};o.appendChild(d);if(it.items&&it.items.length)walk(it.items,lv+1)});walk(ol,0)}
$('bkb').onclick=async()=>{const p=$('bk');if(p.style.display==='block'){p.style.display='none';return}
  const bs=(await all('books')).map(({blob,...m})=>m);$('bkt').value=JSON.stringify({books:bs,notes:await all('notes'),subs,types,gt,qz});p.style.display='block'};
$('bkc').onclick=()=>$('bk').style.display='none';
$('bki').onclick=async()=>{try{const d=JSON.parse($('bkt').value),cur=await all('books'),map={};
  for(const z of d.qz||[])if(!qz.some(y=>y.name===z.name))qz.push(z);saveQz();if(d.types){types=d.types;ls('types',JSON.stringify(types))}if(d.gt){gt=d.gt;ls('gt',gt)}for(const x of d.subs||[])if(!subs.some(y=>y.n===x.n))subs.push(x);saveSubs();
  for(const m of d.books||[]){const b=cur.find(x=>x.name===m.name);if(b){map[m.id]=b.id;b.page=m.page;if(m.subject!==undefined)b.subject=m.subject;if(m.type!==undefined)b.type=m.type;await put('books',b)}}
  for(const n of d.notes||[]){if(!map[n.id])continue;n.key=n.key.replace(n.id,map[n.id]);n.id=map[n.id];await put('notes',n)}
  alert('นำเข้าแล้ว');$('bk').style.display='none';shelf()}catch(e){alert('ข้อมูลไม่ถูกต้อง')}};
let sx=null;$('box').addEventListener('touchstart',e=>{sx=e.touches.length===1?e.touches[0].clientX:null},{passive:true});
$('box').addEventListener('touchend',e=>{if(sx===null||zoom>1||!getSelection().isCollapsed)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70)go(page+(dx<0?1:-1));sx=null});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
open().then(shelf);
</script>
